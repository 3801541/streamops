name: CI/CD — StreamOps


on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: streamops
  HELM_CHART_PATH: charts/streamops

jobs:
  # ─── Job 1 : Tests & lint ────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: pytest test_main.py -v --tb=short

      - name: Lint Helm chart
        working-directory: .
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint $HELM_CHART_PATH

  # ─── Job 2 : Build & push image Docker ──────────────────────────────────────
  build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    # Ne push que sur main ou staging, pas sur les PRs
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="${{ github.ref_name }}-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # ─── Job 3 : Update Helm values → ArgoCD déploie automatiquement ────────────
  deploy:
    name: Update image tag (GitOps)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine environment values file
        id: env
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "values_file=values-prod.yaml" >> $GITHUB_OUTPUT
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "values_file=values-staging.yaml" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Update image tag in Helm values
        run: |
          VALUES_FILE="${{ env.HELM_CHART_PATH }}/${{ steps.env.outputs.values_file }}"

          # Ajoute ou met à jour le bloc image dans le fichier de valeurs
          if grep -q "^image:" "$VALUES_FILE"; then
            # Met à jour le tag existant
            sed -i "s|  tag:.*|  tag: \"${{ needs.build-push.outputs.image_tag }}\"|" "$VALUES_FILE"
          else
            # Ajoute le bloc image
            echo -e "\nimage:\n  tag: \"${{ needs.build-push.outputs.image_tag }}\"" >> "$VALUES_FILE"
          fi

          # Ajoute le repository si absent
          ECR_REGISTRY=$(echo "${{ needs.build-push.outputs.image_uri }}" | cut -d: -f1)
          sed -i "s|  repository:.*|  repository: \"${ECR_REGISTRY}\"|" "$VALUES_FILE" 2>/dev/null || true

      - name: Commit & push updated values
        run: |
          git config user.name  "3801541"
          git config user.email "nsitang1@gmail.com"
          git add ${{ env.HELM_CHART_PATH }}/${{ steps.env.outputs.values_file }}
          git commit -m "chore(${{ steps.env.outputs.environment }}): bump image to ${{ needs.build-push.outputs.image_tag }} [skip ci]"
          git push

      - name: Summary
        run: |
          echo "### Deployment triggered :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.env.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ needs.build-push.outputs.image_uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | will auto-sync within 3 minutes |" >> $GITHUB_STEP_SUMMARY